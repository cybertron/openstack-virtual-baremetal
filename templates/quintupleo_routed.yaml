heat_template_version: 2016-10-14

parameters:
  bmc_flavor:
    type: string
    default: m1.small
    description: The Nova flavor to use for the bmc instance

  bmc_image:
    type: string
    default: CentOS-7-x86_64-GenericCloud
    description: |
      The base image for the bmc instance.  A CentOS 7 image is currently the
      only one supported.

  baremetal_flavor:
    type: string
    default: baremetal
    description: Recommended to be at least 1 vcpu, 4 GB RAM, 50 GB disk

  baremetal_image:
    type: string
    default: empty
    description: The base image to use for baremetal instances

  dhcrelay_flavor:
    type: string
    default: m1.small
    description: The Nova flavor to use for the dhcrelay instance

  dhcrelay_image:
    type: string
    default: CentOS-7-x86_64-GenericCloud
    description: |
      The base image for the dhcrelay instance.  A CentOS 7 image is currently
      the only one supported.

  dhcrelay_userdata_format:
    type: string
    default: RAW
    description: Format of undercloud userdata

  key_name:
    type: string
    default: default
    description: Nova keypair to inject into the undercloud and bmc

  node_count_leaf1:
    type: number
    default: 1
    description: Number of baremetal nodes to deploy

  node_count_leaf2:
    type: number
    default: 1
    description: Number of baremetal nodes to deploy

  private_net:
    type: string
    default: private
    description: Name of a private network which can have floating ips associated with it

  external_net:
    type: string
    default: external
    description: An external network from which floating ips can be provisioned

  router_port_security_enabled:
    type: boolean
    default: false
    description: Wheater port security should be enabled no router ports

  provision_net_leaf0:
    type: string
    default: provision_leaf0
    description: Name of a network that will be used for provisioning traffic
  provision_net_cidr_leaf0:
    type: string
    description: CIDR for provision network subnet
    default: 172.20.0.0/26
  provision_net_router_ipaddr_leaf0:
    type: string
    description: Provisioning network router ip address - leaf0
    default: 172.20.0.62
  provision_net_dhcrelay_ipaddr_leaf0:
    type: string
    description: Provisioning network router ip address - leaf0
    default: 172.20.0.61

  provision_net_leaf1:
    type: string
    default: provision_leaf1
    description: Name of a network that will be used for provisioning traffic
  provision_net_cidr_leaf1:
    type: string
    description: CIDR for provision network subnet
    default: 172.20.0.64/26
  provision_net_router_ipaddr_leaf1:
    type: string
    description: Provisioning network router ip address - leaf1
    default: 172.20.0.126
  provision_net_dhcrelay_ipaddr_leaf1:
    type: string
    description: Provisioning network router ip address - leaf1
    default: 172.20.0.125

  provision_net_leaf2:
    type: string
    default: provision_leaf2
    description: Name of a network that will be used for provisioning traffic
  provision_net_cidr_leaf2:
    type: string
    description: CIDR for provision network subnet
    default: 172.20.0.128/26
  provision_net_router_ipaddr_leaf2:
    type: string
    description: Provisioning network router ip address - leaf2
    default: 172.20.0.190
  provision_net_dhcrelay_ipaddr_leaf2:
    type: string
    description: Provisioning network router ip address - leaf2
    default: 172.20.0.189

  provision_net_shared:
    type: boolean
    description: Whether this network should be shared across all tenants
    default: false

  public_net:
    type: string
    description: Name of the overcloud external network
    default: public

  public_net_cidr:
    type: string
    description: CIDR for external network subnet
    default: 10.0.0.0/24

  public_net_shared:
    type: boolean
    description: Whether this network should be shared across all tenants
    default: false

  bmc_prefix_leaf1:
    type: string
    default: bmc_leaf1
    description: Prefix for the name of the bmc instance - Leaf1

  bmc_prefix_leaf2:
    type: string
    default: bmc_leaf2
    description: Prefix for the name of the bmc instance - Leaf2

  baremetal_prefix_leaf1:
    type: string
    default: baremetal_leaf1
    description: Prefix for the name of the baremetal instances on leaf1

  baremetal_prefix_leaf2:
    type: string
    default: baremetal_leaf2
    description: Prefix for the name of the baremetal instances on leaf2

  undercloud_name:
    type: string
    default: undercloud
    description: Name of the undercloud instance

  undercloud_flavor:
    type: string
    default: m1.xlarge
    description: Nova flavor to use for the undercloud instance

  undercloud_image:
    type: string
    default: CentOS-7-x86_64-GenericCloud
    description: Image to boot as the undercloud instance

  undercloud_user_data:
    type: string
    default: ""
    description: Userdata to inject into the undercloud instance

  undercloud_user_data_format:
    type: string
    default: RAW
    description: Format of undercloud userdata

  inspector_dhcp_ip:
    type: string
    default: 172.20.0.1
    description: |
      The IP address on the undercloud provisioning network. 'local_ip' in
      undercloud.conf

  provision_dhcp_ip:
    type: string
    default: 172.20.0.10
    description: |
      The IP address on the undercloud provisioning network.
      (The first address in the underclouds local_subnet allocation range.
      I.e the dhcp_start address)

  os_user:
    type: string
    default: admin
    description: |
      The user on the host cloud that will be used to provision the
      environment

  os_password:
    type: string
    default: password
    hidden: true
    description: The password for os_user

  os_tenant:
    type: string
    default: admin
    description: The tenant for os_user

  os_auth_url:
    type: string
    default: http://127.0.0.1:5000/v2.0
    description: The Keystone auth_url of the host cloud

  os_project:
    type: string
    default: ''
    description: |
      The project for os_user.  Required for Keystone v3, should be left
      blank for Keystone v2.

  os_user_domain:
    type: string
    default: ''
    description: |
      The user domain for os_user.  Required for Keystone v3, should be left
      blank for Keystone v2.

  os_project_domain:
    type: string
    default: ''
    description: |
      The project domain for os_user.  Required for Keystone v3, should be left
      blank for Keystone v2.

  cloud_data:
    type: string
    default: '{}'
    hidden: true

  # Unused parameter for compatibility with the environment generator
  role:
    type: string
    description: |
      The default role for nodes in this environment.  This parameter is
      ignored by Heat, but used by build-nodes-json.
    default: ''


resources:
  provisioning_router:
    type: OS::Neutron::Router
    properties:
      external_gateway_info:
        network: {get_param: external_net}

  provision_network_leaf0:
    type: OS::Neutron::Net
    properties:
        name: {get_param: provision_net_leaf0}
        shared: {get_param: provision_net_shared}
  provision_subnet_leaf0:
    type: OS::Neutron::Subnet
    properties:
      network: {get_resource: provision_network_leaf0}
      name: {get_param: provision_net_leaf0}
      cidr: {get_param: provision_net_cidr_leaf0}
      gateway_ip: null
      enable_dhcp: false
  provisioning_router_port_leaf0:
    type: OS::Neutron::Port
    properties:
      network: {get_resource: provision_network_leaf0}
      fixed_ips:
        - ip_address: {get_param: provision_net_router_ipaddr_leaf0}
      port_security_enabled: {get_param: router_port_security_enabled}
  provision_router_leaf0:
    type: OS::Neutron::RouterInterface
    properties:
      router: {get_resource: provisioning_router}
      port: {get_resource: provisioning_router_port_leaf0}

  provision_network_leaf1:
    type: OS::Neutron::Net
    properties:
        name: {get_param: provision_net_leaf1}
        shared: {get_param: provision_net_shared}
  provision_subnet_leaf1:
    type: OS::Neutron::Subnet
    properties:
      network: {get_resource: provision_network_leaf1}
      name: {get_param: provision_net_leaf1}
      cidr: {get_param: provision_net_cidr_leaf1}
      gateway_ip: null
      enable_dhcp: false
  provisioning_router_port_leaf1:
    type: OS::Neutron::Port
    properties:
      network: {get_resource: provision_network_leaf1}
      fixed_ips:
        - ip_address: {get_param: provision_net_router_ipaddr_leaf1}
      port_security_enabled: {get_param: router_port_security_enabled}
  provision_router_leaf1:
    type: OS::Neutron::RouterInterface
    properties:
      router: {get_resource: provisioning_router}
      port: {get_resource: provisioning_router_port_leaf1}

  provision_network_leaf2:
    type: OS::Neutron::Net
    properties:
        name: {get_param: provision_net_leaf2}
        shared: {get_param: provision_net_shared}
  provision_subnet_leaf2:
    type: OS::Neutron::Subnet
    properties:
      network: {get_resource: provision_network_leaf2}
      name: {get_param: provision_net_leaf2}
      cidr: {get_param: provision_net_cidr_leaf2}
      gateway_ip: null
      enable_dhcp: false
  provisioning_router_port_leaf2:
    type: OS::Neutron::Port
    properties:
      network: {get_resource: provision_network_leaf2}
      fixed_ips:
        - ip_address: {get_param: provision_net_router_ipaddr_leaf2}
      port_security_enabled: {get_param: router_port_security_enabled}
  provision_router_leaf2:
    type: OS::Neutron::RouterInterface
    properties:
      router: {get_resource: provisioning_router}
      port: {get_resource: provisioning_router_port_leaf2}

  public_network:
    type: OS::Neutron::Net
    properties:
      name: {get_param: public_net}
      shared: {get_param: public_net_shared}

  public_subnet:
    type: OS::Neutron::Subnet
    properties:
      network: {get_resource: public_network}
      name: {get_param: public_net}
      cidr: {get_param: public_net_cidr}
      gateway_ip: null
      enable_dhcp: false

  private_network:
    type: OS::OVB::PrivateNetwork
    properties:
      external_net: {get_param: external_net}
      private_net: {get_param: private_net}

  baremetal_networks_routed:
    type: OS::OVB::BaremetalNetworksRouted

  dhcp_relay:
    type: OS::OVB::DhcpRelay
    depends_on:
      - provision_subnet_leaf0
      - provision_subnet_leaf1
      - provision_subnet_leaf2
      - public_subnet
    properties:
      flavor: {get_param: dhcrelay_flavor}
      image: {get_param: dhcrelay_image}
      key_name: {get_param: key_name}
      userdata_format: {get_param: dhcrelay_userdata_format}
      provision_dhcp_ip: {get_param: provision_dhcp_ip}
      inspector_dhcp_ip: {get_param: inspector_dhcp_ip}
      private_net: {get_attr: [private_network, private_net]}
      network_leaf0: {get_resource: provision_network_leaf0}
      network_leaf1: {get_resource: provision_network_leaf1}
      network_leaf2: {get_resource: provision_network_leaf2}
      ipaddr_leaf0: {get_param: provision_net_dhcrelay_ipaddr_leaf0}
      ipaddr_leaf1: {get_param: provision_net_dhcrelay_ipaddr_leaf1}
      ipaddr_leaf2: {get_param: provision_net_dhcrelay_ipaddr_leaf2}

  undercloud_env:
    type: OS::OVB::UndercloudEnvironment
    depends_on: [provision_subnet_leaf0, public_subnet]
    properties:
      undercloud_flavor: {get_param: undercloud_flavor}
      undercloud_image: {get_param: undercloud_image}
      key_name: {get_param: key_name}
      undercloud_name: {get_param: undercloud_name}
      undercloud_user_data_format: {get_param: undercloud_user_data_format}
      undercloud_user_data: {get_param: undercloud_user_data}
      private_net: {get_attr: [private_network, private_net]}
      provision_net: {get_resource: provision_network_leaf0}
      public_net: {get_resource: public_network}
      external_net: {get_param: external_net}

  baremetal_env_leaf1:
    type: OS::OVB::BaremetalEnvironment
    depends_on:
      - baremetal_networks_routed
      - provision_subnet_leaf1
      - public_subnet
    properties:
      baremetal_flavor: {get_param: baremetal_flavor}
      baremetal_image: {get_param: baremetal_image}
      key_name: {get_param: key_name}
      node_count: {get_param: node_count_leaf1}
      public_net: {get_resource: public_network}
      private_net: {get_attr: [private_network, private_net]}
      provision_net: {get_resource: provision_network_leaf1}
      bmc_flavor: {get_param: bmc_flavor}
      bmc_prefix: {get_param: bmc_prefix_leaf1}
      bmc_image: {get_param: bmc_image}
      baremetal_prefix: {get_param: baremetal_prefix_leaf1}
      os_user: {get_param: os_user}
      os_password: {get_param: os_password}
      os_tenant: {get_param: os_tenant}
      os_auth_url: {get_param: os_auth_url}
      os_project: {get_param: os_project}
      os_user_domain: {get_param: os_user_domain}
      os_project_domain: {get_param: os_project_domain}
      cloud_data: {get_param: cloud_data}

  baremetal_env_leaf2:
    type: OS::OVB::BaremetalEnvironment
    depends_on:
      - baremetal_networks_routed
      - provision_subnet_leaf2
      - public_subnet
    properties:
      baremetal_flavor: {get_param: baremetal_flavor}
      baremetal_image: {get_param: baremetal_image}
      key_name: {get_param: key_name}
      node_count: {get_param: node_count_leaf2}
      public_net: {get_resource: public_network}
      private_net: {get_attr: [private_network, private_net]}
      provision_net: {get_resource: provision_network_leaf2}
      bmc_flavor: {get_param: bmc_flavor}
      bmc_prefix: {get_param: bmc_prefix_leaf2}
      bmc_image: {get_param: bmc_image}
      baremetal_prefix: {get_param: baremetal_prefix_leaf2}
      os_user: {get_param: os_user}
      os_password: {get_param: os_password}
      os_tenant: {get_param: os_tenant}
      os_auth_url: {get_param: os_auth_url}
      os_project: {get_param: os_project}
      os_user_domain: {get_param: os_user_domain}
      os_project_domain: {get_param: os_project_domain}
      cloud_data: {get_param: cloud_data}

outputs:
  undercloud_host_floating_ip:
    description: "floating ip of the undercloud instance"
    value:
      get_attr: [undercloud_env, undercloud_host_floating_ip]
  undercloud_host_private_ip:
    description: "ip of the undercloud instance on the private network"
    value:
      get_attr: [undercloud_env, undercloud_host_private_ip]
